<h1 class="title">Open from:</h1>
<div class="sources">
  <lib-file-source-selector [current]="currentFileService?.sourceName ?? 'unknown'"
    (sourceSelected)="sourceSelected($event)"></lib-file-source-selector>
</div>
@if (showFilePicker()) {
<div class="explorer">
  <lib-file-explorer [service]="currentFileService" (selectFile)="openFile($event)"></lib-file-explorer>
</div>
}
@else {
<section role="listbox" class="recents">
  <app-recents [allowRemove]="true"></app-recents>
</section>
}
