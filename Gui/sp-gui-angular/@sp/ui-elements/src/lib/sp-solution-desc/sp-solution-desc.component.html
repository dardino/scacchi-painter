@if (viewMode() === 'both' || viewMode() === 'html') {
<div class="richeditor">
  <ngx-editor-menu [editor]="editor" [toolbar]="toolbar" [colorPresets]="colorPresets">
  </ngx-editor-menu>
  <ngx-editor [editor]="editor" [style.fontSize]="solutionFontSize()" outputFormat="html"
    placeholder="Run solution engine with the 'play' button" [(ngModel)]="solutionHtml">
  </ngx-editor>
</div>
}
@if (viewMode() === 'both' || viewMode() === 'txt') {
<div [style.fontSize]="solutionFontSize()" class="solutions">
  @for (treeNode of moveTree(); track $index) {
    @if (treeNode.parentId == null && $index > 0) { <hr /> }
    @if (lineBr(treeNode)) { <div class="linebr"></div> }
    <lib-sp-solution-move
      tabindex="0"
      [attr.data-moveno]="treeNode.move.num"
      [hideNum]="mode === 'inline' && !lineBr(treeNode) && treeNode.parentId !== null && !treeNode.move.refutes"
      [value]="treeNode.move" [refutes]="treeNode.move.refutes"
      [class]="[
        'solution',
        mode,
        treeNode.move.threat ? 'threat' : '',
        treeNode.move.zugzwang ? 'zugzwang' : '',
        treeNode.move.isKey ? 'key' : '',
        treeNode.move.refutes ? 'refutes' : '',
      ].join(' ')" (focus)="onClickMove($index)"
    ></lib-sp-solution-move>
  }
</div>
}
