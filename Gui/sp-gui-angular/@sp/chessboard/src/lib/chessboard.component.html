<div class="chessboard-layout" #container tabindex="-1" (blur)="chessboardBlur()">
  <div class="chessboard-image" #cbImage [ngClass]="{customCursor: cursor}">
    <chess-board
      [attr.hide-labels]="smallBoard"
      [attr.fen]="fen()"
      class="chess-board"
    ></chess-board>
  </div>
  @if (!hideInfo) {
    <div class="short-info">
      <span class="stipulation">{{stipulationDesc()}}</span>
      <span class="twins">
        <ol>
          @if (viewDiagram()) {
            <li>Diagram</li>
          }
          @for (t of twins(); track $index) {
            <li>{{ t }}</li>
          }
        </ol>
      </span>
      <span class="piececounter">{{ pieceCounter() }}</span>
    </div>
  }
  @if (!hideInfo) {
    <div class="fen" tabindex="0" (click)="copyFen()" (keydown.enter)="copyFen()">
      <span>FEN:</span>
      <span>{{ fen() }}</span>
    </div>
  }
</div>
