<div class="chessboard-layout" #container tabindex="-1" (blur)="chessboardBlur()">
  <div class="chessboard-image" #cbHtml [ngClass]="{customCursor: cursor}">
    <chess-board #chessboard [attr.hide-labels]="smallBoard()" [attr.ignore-fen-active-color]="true"
      [attr.disable-piece-selection]="true" [disabled]="smallBoard()" [attr.fen]="fen()" auto-select-piece-on-click
      (cellMainClick)="onCellClick($event)" (fenChange)="internalFenChanged($event)" class="chess-board"></chess-board>
  </div>
  @if (!hideInfo()) {
  <div class="short-info">
    <span class="stipulation">{{stipulationDesc()}}</span>
    <span class="twins">
      <ol>
        @if (viewDiagram()) {
        <li>Diagram</li>
        }
        @for (t of twins(); track $index) {
        <li>{{ t }}</li>
        }
      </ol>
    </span>
    <span class="piececounter">{{ pieceCounter() }}</span>
  </div>
  }
  @if (!hideInfo()) {
  <div class="fen" tabindex="0" (click)="copyFen()" (keydown.enter)="copyFen()">
    <span>FEN:</span>
    <span>{{ fen() }}</span>
  </div>
  }
</div>
