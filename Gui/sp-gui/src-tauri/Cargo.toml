[package]
name = "scacchi-painter-x"
version = "0.4.2"
description = "Scacchi Painter X"
authors = ["Gabriele Brunori"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["macos-private-api"] }
tauri-plugin-opener = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-shell = "2.4.0"
problem-solver = { path = "../../../CoreRust/crates/problem-solver" }
problem-io = { path = "../../../CoreRust/crates/problem-io" }
