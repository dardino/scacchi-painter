[package]
name = "scacchi-painter-x"
version = "0.5.0"
description = "Scacchi Painter X"
authors = ["Ganori"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["macos-private-api"] }
tauri-plugin-opener = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-shell = "2.4.0"
problem-solver = { path = "../../../CoreRust/crates/problem-solver" }
problem-io = { path = "../../../CoreRust/crates/problem-io" }

[package.metadata.tauri.windows]
app_id = "Ganori.ScacchiPainterX"
manufacturer = "Ganori"
product_name = "Scacchi Painter X"

[package.metadata.tauri.bundle]
# Tauri 2 exposes Windows bundle settings through the standard `bundle` section.
# MSIX/Appx packaging is produced through the Windows packaging toolchain and a
# signed Store-compliant bundle, not by publishing the unsigned `.exe` installer.
