packages:
  - "Gui/sp-gui-angular"
  - "Gui/sp-gui-angular/api"
  - "Gui/sp-gui-angular/@sp/chessboard"
  - "Gui/sp-gui-angular/@sp/dbmanager"
  - "Gui/sp-gui-angular/@sp/host-bridge"
  - "Gui/sp-gui-angular/@sp/ui-elements"
  - "Gui/popeye-js"
  - "Gui/sp-gui"
  - "CoreJS"

overrides:
  "prosemirror-model": "1.21.0"
  "sharp": "^0.35.5"
  "prosemirror-view": "^1.42.9"
  # Dev-tooling transitive dependencies pinned to patched versions
  "axios": "0.34.0"
  "form-data": "2.5.6"
  "qs": "6.17.1"
  "file-type": "^21.3.2"
  "optimist>minimist": "1.2.8"
  "child-process-promise>cross-spawn": "7.0.6"
  "request>tough-cookie": "4.1.3"
  "request>uuid": "11.1.1"
  # "@dardino/chess-board": "link:../chess-board"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  optipng-bin: true
  sharp: true
  zopflipng-bin: false

minimumReleaseAgeExclude:
  - "@dardino/chess-board"
  - "@tauri-apps/api@2.12.1"
