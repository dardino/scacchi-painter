name: CI - Tag Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml

  build_tauri:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: ""
            artifact_name: tauri-linux
            artifact_paths: |
              Gui/sp-gui/src-tauri/target/release/bundle/**/*.AppImage
              Gui/sp-gui/src-tauri/target/release/bundle/**/*.deb
              Gui/sp-gui/src-tauri/target/release/bundle/**/*.rpm
          - name: windows
            os: windows-2022
            target: ""
            artifact_name: tauri-windows
            artifact_paths: |
              Gui/sp-gui/src-tauri/target/release/bundle/**/*.exe
              Gui/sp-gui/src-tauri/target/release/bundle/**/*.msi
          - name: macos_arm64
            os: macos-26
            target: aarch64-apple-darwin
            artifact_name: tauri-macos-arm64
            artifact_paths: |
              Gui/sp-gui/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
              Gui/sp-gui/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app
          - name: macos_x64
            os: macos-26-intel
            target: x86_64-apple-darwin
            artifact_name: tauri-macos-x64
            artifact_paths: |
              Gui/sp-gui/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
              Gui/sp-gui/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.app
          - name: android
            os: ubuntu-22.04
            target: "android"
            artifact_name: tauri-android-apk
            artifact_paths: |
              Gui/sp-gui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
    runs-on: ${{ matrix.os }}
    name: Build Tauri (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Java
        if: matrix.name == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        if: matrix.name == 'android'
        shell: bash
        run: |
          mkdir -p "$HOME/android-sdk"
          cd "$HOME/android-sdk"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d .
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          # Accept Android SDK licenses non-interactively. This step is known to prompt in CI,
          # and a raw pipe can exit with a broken pipe even when licenses are actually accepted.
          set +e
          yes 2>/dev/null | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1
          set -e

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export NDK_HOME="$ANDROID_NDK_HOME"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != '' && matrix.target != 'android'
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux' && matrix.name != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Install Angular dependencies
        working-directory: ./Gui/sp-gui-angular
        run: pnpm install --frozen-lockfile

      - name: Install Tauri dependencies
        working-directory: ./Gui/sp-gui
        run: pnpm install --frozen-lockfile

      - name: Build preprequistes
        working-directory: ./CoreJS
        run: pnpm build

      - name: Initialize Android project if needed
        if: matrix.name == 'android'
        working-directory: ./Gui/sp-gui
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init --ci
          fi

      - name: Setup Gradle for Android project
        if: matrix.name == 'android'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Tauri app
        shell: bash
        working-directory: ./Gui/sp-gui
        run: |
          if [ "${{ matrix.name }}" = "android" ]; then
            pnpm tauri android build --apk --ci
          elif [ -n "${{ matrix.target }}" ]; then
            pnpm tauri build --target "${{ matrix.target }}"
          else
            pnpm tauri build
          fi

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  deploy_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - ci
      - build_tauri
    runs-on: ubuntu-22.04
    name: Deploy to Production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download web deploy artifact
        uses: actions/download-artifact@v6
        with:
          name: web-deploy
          path: ./deploy/web

      - name: Download api deploy artifact
        uses: actions/download-artifact@v6
        with:
          name: api-deploy
          path: ./deploy/api

      - name: Deploy to Azure Static Web Apps (Production)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_SEA_080BC3503 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/deploy/web"
          api_location: "/deploy/api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  create_release_notes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: deploy_production
    runs-on: ubuntu-22.04
    name: Create/Update Release Notes
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get tag version
        id: tag_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_LINE="Live at: https://orange-sea-080bc3503.azurestaticapps.net/"
          TAURI_ASSETS="Tauri desktop assets attached to this release:\n- Linux AppImage\n- Linux Debian package (.deb)\n- Linux RPM package (.rpm)\n- Windows installer (.exe)\n- Windows installer (.msi)\n- macOS bundle (.dmg)\n- Android APK (.apk)"

          # Check if release exists
          if gh release view "${{ steps.tag_version.outputs.version }}" &>/dev/null; then
            # Release exists - get current body and append new line
            CURRENT_BODY=$(gh release view "${{ steps.tag_version.outputs.version }}" --json body -q .body)
            UPDATED_BODY="$CURRENT_BODY

          $NEW_LINE

          $TAURI_ASSETS"
            gh release edit "${{ steps.tag_version.outputs.version }}" --notes "$UPDATED_BODY"
          else
            # Release doesn't exist - create new one
            RELEASE_BODY="Release ${{ steps.tag_version.outputs.version }}

          $NEW_LINE

          $TAURI_ASSETS"
            gh release create "${{ steps.tag_version.outputs.version }}" --title "Release ${{ steps.tag_version.outputs.version }}" --notes "$RELEASE_BODY" --draft=false
          fi

  upload_tauri_assets:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build_tauri
      - create_release_notes
    runs-on: ubuntu-22.04
    name: Upload Tauri Release Assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Tauri artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: tauri-*
          merge-multiple: true
          path: ./release-assets

      - name: Get tag version
        id: tag_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! find ./release-assets -type f | grep -q .; then
            echo "No Tauri assets found in ./release-assets" >&2
            exit 1
          fi
          find ./release-assets -type f -print0 | while IFS= read -r -d '' asset; do
            gh release upload "${{ steps.tag_version.outputs.version }}" "$asset" --clobber --repo "${{ github.repository }}"
          done

      - name: Update release notes with asset links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          current_body=$(gh release view "${{ steps.tag_version.outputs.version }}" --json body -q .body)
          CURRENT_BODY="$current_body" python3 - <<'PY'
          import os
          import re
          import json
          import subprocess

          def asset_label(name: str) -> str:
            lower = name.lower()
            if lower.endswith(".appimage"):
              return "Linux AppImage"
            if lower.endswith(".deb"):
              return "Linux Debian package (.deb)"
            if lower.endswith(".rpm"):
              return "Linux RPM package (.rpm)"
            if lower.endswith(".exe"):
              return "Windows installer (.exe)"
            if lower.endswith(".msi"):
              return "Windows installer (.msi)"
            if lower.endswith(".dmg"):
              return "macOS disk image (.dmg)"
            if lower.endswith(".apk"):
              return "Android APK (.apk)"
            return name

          release_json = subprocess.run(
            [
              "gh",
              "api",
                f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['TAG_VERSION']}",
            ],
            capture_output=True,
            text=True,
            check=True,
          ).stdout
          assets = json.loads(release_json).get("assets", [])
          asset_lines = "\n".join(
            f"- [{asset_label(asset['name'])}]({asset['browser_download_url']})"
            for asset in assets
          )

          body = os.environ["CURRENT_BODY"]
          replacement = "Tauri desktop assets attached to this release:\n"
          if asset_lines:
              replacement += asset_lines + "\n"

          updated_body = re.sub(
              r"\nTauri desktop assets attached to this release:\n.*\Z",
              "\n" + replacement,
              body,
              flags=re.S,
          )
          if updated_body == body:
              updated_body = body.rstrip() + "\n\n" + replacement

          subprocess.run(
              [
                  "gh",
                  "release",
                  "edit",
                  "${{ steps.tag_version.outputs.version }}",
                  "--notes-file",
                  "-",
                  "--repo",
                  "${{ github.repository }}",
              ],
              input=updated_body,
              text=True,
              check=True,
          )
          PY
